[package]
name = "stable-swap-circuit-breaker"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
pinocchio = { version = "0.11", features = ["cpi"] }
pinocchio-system = "0.6"
pinocchio-token = "0.6"
pinocchio-log = "0.5"
solana-program-log = "1.2.0"

[dev-dependencies]
litesvm = "0.12"
solana-keypair = "3.1"
solana-signer = "3"
solana-pubkey = "3"
solana-instruction = "3"
solana-message = "3"
solana-transaction = "3"
solana-hash = "3"
solana-system-interface = "3"
solana-rent = "3"
solana-address = "2"

[features]
default = []
bpf-entrypoint = []
test = []
