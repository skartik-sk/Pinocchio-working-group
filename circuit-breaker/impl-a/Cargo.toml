[package]
name = "escrow-circuit-breaker"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
pinocchio = { version = "0.11", features = ["cpi"] }
pinocchio-system = "0.2"
pinocchio-token = "0.6"
pinocchio-log = "0.5"
solana-program = "1.18"
solana-program-log = "1.2.0"

[dev-dependencies]
solana-program-log = "1.2.0"
solana-program-test = "1.18"
solana-sdk = "1.18"
spl-token = "4.0"

[features]
default = []
bpf-entrypoint = []
test = []
